name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (default: VERSION_NAME from gradle.properties, without -SNAPSHOT)'
        required: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'uber/ussi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out USSI sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.release_version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "$RELEASE_VERSION_INPUT" ]]; then
              release_version="$RELEASE_VERSION_INPUT"
            else
              release_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
              release_version="${release_version%-SNAPSHOT}"
            fi
          else
            if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Release tag must have the form vX.Y.Z: $RELEASE_TAG" >&2
              exit 1
            fi
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          fi
          configured_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          configured_base="${configured_version%-SNAPSHOT}"
          if [[ "$configured_base" != "$release_version" ]]; then
            echo "Release version ($release_version) must match VERSION_NAME ($configured_version)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          awk -v ver="$RELEASE_VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" ver "]") == 1) { found=1; next } }
            found
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "Add a ## [$RELEASE_VERSION] section to CHANGELOG.md" >&2
            exit 1
          fi

      - name: Prepare release version on main
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i -E "s/^VERSION_NAME=.*/VERSION_NAME=${RELEASE_VERSION}/" gradle.properties
          sed -i -E "s/maven_coordinates = \"com.uber.ussi:ussi:[^\"]+\"/maven_coordinates = \"com.uber.ussi:ussi:${RELEASE_VERSION}\"/" BUILD.bazel
          if git diff --quiet; then
            echo "VERSION_NAME and BUILD.bazel already at release version ${RELEASE_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${RELEASE_VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.0
        with:
          cache-disabled: true

      - name: Test with Gradle
        run: ./gradlew test --no-daemon

      - name: Publish and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: 'true'
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.PGP_PRIVATE_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.PGP_SIGNING_KEY_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PGP_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.3.3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: release_notes.md
          generate_release_notes: false
